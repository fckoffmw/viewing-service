<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Контент</title>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <a href="/" class="nav-logo">w2g</a>
      <a href="/index.html" class="nav-link">Комнаты</a>
      <a href="/content.html" class="nav-link active">Контент</a>
    </div>
    <div class="nav-right">
      <span class="nav-username" id="nav-username"></span>
      <button onclick="logout()" class="btn btn-secondary btn-sm">Выйти</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Контент</h1>
      <div style="display:flex;gap:8px">
        <a id="room-link" href="#" style="display:none" class="btn btn-secondary">В комнату</a>
        <button onclick="openAddModal()" class="btn btn-primary">+ Добавить</button>
      </div>
    </div>

    <div id="sources-container"></div>
  </div>

  <!-- add modal -->
  <div id="add-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeAddModal()">
    <div class="modal">
      <h2>Добавить источник</h2>
      <form id="add-form">
        <input type="text" id="source-name" placeholder="Название" required class="modal-input">
        <input type="text" id="source-url" placeholder="URL iframe" required class="modal-input">
        <div class="modal-btns">
          <button type="button" onclick="closeAddModal()" class="btn btn-secondary">Отмена</button>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="/src/content.js"></script>
</body>
</html>
