<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Контент</title>
  <link rel="stylesheet" href="/static/content.css">
</head>
<body>
  <div class="container">
    <h1><a href="/index.html">w2g</a> — Контент</h1>
    <div class="header-row">
      <a href="/room.html" class="header-btn">В комнату</a>
      <button onclick="openModal()" class="header-btn primary">+ Добавить</button>
      <button onclick="logout()" class="header-btn">Выход</button>
    </div>
    <div id="sources"></div>
  </div>

  <div id="modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Добавить источник</h2>
      <form id="add-form">
        <input type="text" id="source-name" placeholder="Название" required>
        <input type="text" id="source-url" placeholder="URL iframe" required>
        <div class="modal-btns">
          <button type="button" onclick="closeModal()" class="cancel-btn">Отмена</button>
          <button type="submit" class="submit-btn">Добавить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- auth check ---
    async function checkAuth() {
      var res = await fetch("/auth/me");
      if (!res.ok) {
        window.location.href = "/login.html";
        return false;
      }
      return true;
    }

    var activeSourceId = null;

    function openModal() {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("source-name").value = "";
      document.getElementById("source-url").value = "";
      document.getElementById("source-name").focus();
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    document.getElementById("add-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      var name = document.getElementById("source-name").value.trim();
      var url = document.getElementById("source-url").value.trim();
      if (!name || !url) return;

      var res = await fetch("/api/sources", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, url: url }),
      });

      var data = await res.json();
      if (res.ok) {
        closeModal();
        loadSources();
      } else {
        alert("Ошибка: " + data.error);
      }
    });

    async function loadSources() {
      var container = document.getElementById("sources");

      try {
        var roomRes = await fetch("/api/room");
        if (roomRes.ok) {
          var room = await roomRes.json();
          if (room.current_source) {
            activeSourceId = room.current_source.id;
          }
        }
      } catch {}

      var res;
      try {
        res = await fetch("/api/sources");
      } catch {
        container.innerHTML = '<p class="error">Не удалось загрузить</p>';
        return;
      }

      if (!res.ok) {
        container.innerHTML = '<p class="error">Ошибка сервера</p>';
        return;
      }

      var sources = await res.json();
      if (sources.length === 0) {
        container.innerHTML = '<p>Пока пусто</p>';
        return;
      }

      container.innerHTML = sources
        .map(function(s) {
          var isActive = s.id === activeSourceId;
          var badge = isActive ? '<span class="badge">активен</span>' : '';
          var cardClass = isActive ? 'source-card source-card-active' : 'source-card';
          var btnDisabled = isActive ? 'disabled' : '';
          var btnText = isActive ? 'Активен' : 'Сделать активным';
          return (
            '<div class="' + cardClass + '">' +
              '<div class="source-info">' +
                '<h2>' + esc(s.name) + ' ' + badge + '</h2>' +
                '<span class="source-id">id: ' + esc(s.id) + '</span>' +
              '</div>' +
              '<button onclick="setActive(\'' + s.id + '\')" class="set-active-btn" ' + btnDisabled + '>' + btnText + '</button>' +
            '</div>'
          );
        })
        .join("");
    }

    async function setActive(id) {
      try {
        var res = await fetch("/api/room/source", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source_id: id }),
        });

        var data = await res.json();

        if (res.ok) {
          loadSources();
        } else {
          alert("Ошибка: " + data.error);
        }
      } catch {
        alert("Не удалось обновить источник");
      }
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function logout() {
      await fetch("/auth/logout", { method: "POST" });
      window.location.href = "/login.html";
    }

    // Start
    checkAuth().then(function(ok) {
      if (ok) {
        loadSources();
      }
    });
  </script>
</body>
</html>
