<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Комната</title>
  <link rel="stylesheet" href="/static/room.css">
</head>
<body>
  <div class="layout">
    <div class="player">
      <a href="/content.html" class="back-link">← К контенту</a>
      <div id="player-container">
        <p id="player-placeholder">Загрузка...</p>
        <iframe id="player-frame" style="display:none" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
    <div class="chat">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="500" autocomplete="off">
        <button type="submit">→</button>
      </form>
    </div>
  </div>

  <script>
    // --- auth check + get username ---
    var currentUsername = "";

    async function checkAuth() {
      try {
        const res = await fetch("/auth/me");
        if (!res.ok) {
          window.location.href = "/login.html";
          return false;
        }
        const user = await res.json();
        currentUsername = user.username;
        return true;
      } catch {
        window.location.href = "/login.html";
        return false;
      }
    }

    // --- player ---
    async function loadPlayer() {
      try {
        const res = await fetch("/api/room");
        if (!res.ok) {
          document.getElementById("player-placeholder").textContent = "Не удалось загрузить комнату";
          return;
        }
        const room = await res.json();
        if (room.current_source && room.current_source.url) {
          var frame = document.getElementById("player-frame");
          frame.src = room.current_source.url;
          frame.style.display = "block";
          document.getElementById("player-placeholder").style.display = "none";
        } else {
          document.getElementById("player-placeholder").textContent = "Источник не выбран. Выберите на странице контента.";
        }
      } catch {
        document.getElementById("player-placeholder").textContent = "Ошибка загрузки";
      }
    }

    // --- chat ---
    var messagesEl = document.getElementById("chat-messages");
    var form = document.getElementById("chat-form");
    var input = document.getElementById("chat-input");
    var ws;

    function connect() {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws");

      ws.onopen = function() {
        appendMessage("system", "", "Подключено");
      };

      ws.onmessage = function(e) {
        var data = JSON.parse(e.data);
        console.log("msg:", data.username, "current:", currentUsername, "match:", data.username === currentUsername);
        appendMessage(data.username === currentUsername ? "me" : "other", data.username, data.text);
      };

      ws.onclose = function() {
        appendMessage("system", "", "Отключено");
      };

      ws.onerror = function() {
        appendMessage("system", "", "Ошибка соединения");
      };
    }

    function appendMessage(type, username, text) {
      var div = document.createElement("div");
      div.className = "msg msg-" + type;
      if (type === "me") {
        div.innerHTML = '<span class="username">[' + esc(username) + ']</span> <span class="text">' + esc(text) + '</span>';
      } else if (type === "other") {
        div.innerHTML = '<span class="username">[' + esc(username) + ']</span> <span class="text">' + esc(text) + '</span>';
      } else {
        div.innerHTML = '<span class="text">[ ' + esc(text) + ' ]</span>';
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ text: text }));
      input.value = "";
    });

    // Start
    checkAuth().then(function(ok) {
      if (ok) {
        loadPlayer();
        connect();
      }
    });
  </script>
</body>
</html>
