<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Комната</title>
  <script src="https://vk.ru/js/api/videoplayer.js"></script>
  <link rel="stylesheet" href="/static/room.css">
</head>
<body>
  <div class="layout">
    <div class="player">
      <a href="/content.html" class="back-link">← К контенту</a>
      <div id="player-container">
        <p id="player-placeholder">Загрузка...</p>
        <iframe id="player-frame" style="display:none" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
    <div class="chat">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="500" autocomplete="off">
        <button type="submit">→</button>
      </form>
    </div>
  </div>

  <script>
    // --- player ---
    var player = null;
    var isLocalEvent = false;

    function initPlayer() {
      var frame = document.getElementById("player-frame");
      player = VK.VideoPlayer(frame);

      player.on("inited", function() {
        appendMessage("system", "Плеер инициализирован");
      });

      player.on("play", function() {
        if (isLocalEvent) return;
        sendSync({ type: "play", time: player.getCurrentTime() });
      });

      player.on("pause", function() {
        if (isLocalEvent) return;
        sendSync({ type: "pause", time: player.getCurrentTime() });
      });

      player.on("timeupdate", function() {
        if (isLocalEvent) return;
        sendSync({ type: "timeupdate", time: player.getCurrentTime() });
      });
    }

    function handleSync(data) {
      if (data.clientId === clientId) return;

      isLocalEvent = true;
      try {
        if (data.type === "play") {
          player.seek(data.time);
          player.play();
        } else if (data.type === "pause") {
          player.seek(data.time);
          player.pause();
        } else if (data.type === "seek" || data.type === "timeupdate") {
          player.seek(data.time);
        }
      } finally {
        isLocalEvent = false;
      }
    }

    function sendSync(event) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: "video_sync",
        payload: event
      }));
    }

    async function loadPlayer() {
      try {
        const res = await fetch("/api/room");
        if (!res.ok) {
          document.getElementById("player-placeholder").textContent = "Не удалось загрузить комнату";
          return;
        }
        const room = await res.json();
        if (room.current_source && room.current_source.url) {
          var frame = document.getElementById("player-frame");
          var url = room.current_source.url;
          if (url.indexOf('js_api=1') === -1) {
            url += (url.indexOf('?') === -1 ? '?' : '&') + 'js_api=1';
          }
          frame.src = url;
          frame.style.display = "block";
          document.getElementById("player-placeholder").style.display = "none";

          frame.onload = function() {
            initPlayer();
          };
        } else {
          document.getElementById("player-placeholder").textContent = "Источник не выбран. Выберите на странице контента.";
        }
      } catch {
        document.getElementById("player-placeholder").textContent = "Ошибка загрузки";
      }
    }

    // --- chat ---
    var clientId = "user_" + Math.random().toString(36).slice(2, 8);
    var messagesEl = document.getElementById("chat-messages");
    var form = document.getElementById("chat-form");
    var input = document.getElementById("chat-input");
    var ws;

    function connect() {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws");

      ws.onopen = function() {
        appendMessage("system", "Подключено");
      };

      ws.onmessage = function(e) {
        var data = JSON.parse(e.data);
        if (data.sync) {
          handleSync(data.sync);
          return;
        }
        appendMessage(data.clientId === clientId ? "me" : "other", data.text);
      };

      ws.onclose = function() {
        appendMessage("system", "Отключено");
      };
    }

    function appendMessage(type, text) {
      var div = document.createElement("div");
      div.className = "msg msg-" + type;
      if (type === "me") {
        div.textContent = "Me: " + text;
      } else if (type === "other") {
        div.textContent = "NotMe: " + text;
      } else {
        div.textContent = "[ " + text + " ]";
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: "chat_message",
        clientId: clientId,
        payload: { clientId: clientId, text: text }
      }));
      input.value = "";
    });

    loadPlayer();
    connect();
  </script>
</body>
</html>
