<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Комната</title>
  <link rel="stylesheet" href="/static/room.css">
</head>
<body>
  <div class="layout">
    <div class="player">
      <div class="top-bar">
        <a href="/index.html" class="back-link">← На главную</a>
        <span id="room-title" class="room-title">Загрузка...</span>
        <span id="invite-code-display" class="invite-code"></span>
        <a id="content-link" href="/content.html" class="content-link">К контенту →</a>
      </div>
      <div id="player-container">
        <p id="player-placeholder">Загрузка...</p>
        <iframe id="player-frame" style="display:none" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
    <div class="chat">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="500" autocomplete="off">
        <button type="submit">→</button>
      </form>
    </div>
  </div>

  <script>
    var currentUsername = "";
    var currentUserId = "";
    var inviteCode = "";

    async function checkAuth() {
      try {
        const res = await fetch("/auth/me");
        if (!res.ok) {
          window.location.href = "/login.html";
          return false;
        }
        const user = await res.json();
        currentUsername = user.username;
        currentUserId = user.id;
        return true;
      } catch {
        window.location.href = "/login.html";
        return false;
      }
    }

    // --- player ---
    async function loadPlayer() {
      if (!inviteCode) return;

      try {
        const res = await fetch("/api/rooms/" + inviteCode);
        if (!res.ok) {
          document.getElementById("player-placeholder").textContent = "Комната не найдена";
          return;
        }
        const room = await res.json();
        console.log("Room data:", room);
        console.log("Source URL:", room.current_source?.url);
        document.getElementById("room-title").textContent = room.name || "Комната";
        document.getElementById("invite-code-display").textContent = inviteCode;
        document.getElementById("content-link").href = "/content.html?invite=" + inviteCode;
        roomOwnerId = room.owner_id;

        if (room.current_source && room.current_source.url) {
          var frame = document.getElementById("player-frame");
          var placeholder = document.getElementById("player-placeholder");
          if (frame && placeholder) {
            frame.src = decodeURIComponent(room.current_source.url);
            frame.style.display = "block";
            placeholder.style.display = "none";
          }
        } else {
          var link = inviteCode ? '/content.html?invite=' + inviteCode : '/content.html';
          document.getElementById("player-placeholder").innerHTML = 'Источник не выбран. <a href="' + link + '">Выберите на странице контента</a>.';
        }
      } catch (e) {
        console.error("Player error:", e);
        document.getElementById("player-placeholder").textContent = "Ошибка загрузки";
      }
    }

    // --- chat ---
    var messagesEl = document.getElementById("chat-messages");
    var form = document.getElementById("chat-form");
    var input = document.getElementById("chat-input");
    var ws;

    function connect() {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      var wsPath = inviteCode ? "/ws/" + inviteCode : "/ws";
      ws = new WebSocket(proto + "//" + location.host + wsPath);

      ws.onopen = function() {
        appendMessage("system", "", "Подключено");
      };

      ws.onmessage = function(e) {
        var data = JSON.parse(e.data);
        console.log("msg:", data.username, "current:", currentUsername, "match:", data.username === currentUsername);
        appendMessage(data.username === currentUsername ? "me" : "other", data.username, data.text);
      };

      ws.onclose = function() {
        appendMessage("system", "", "Отключено");
      };

      ws.onerror = function() {
        appendMessage("system", "", "Ошибка соединения");
      };
    }

    function appendMessage(type, username, text) {
      var div = document.createElement("div");
      div.className = "msg msg-" + type;
      var color = type === "me" ? "#a8c0ff" : getUserColor(username);
      if (type === "me") {
        div.innerHTML = '<span class="username" style="color:' + color + '">[' + esc(username) + ']</span> <span class="text">' + esc(text) + '</span>';
      } else if (type === "other") {
        div.innerHTML = '<span class="username" style="color:' + color + '">[' + esc(username) + ']</span> <span class="text">' + esc(text) + '</span>';
      } else {
        div.innerHTML = '<span class="text">[ ' + esc(text) + ' ]</span>';
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function getUserColor(name) {
      var colors = ["#7eb8da", "#9ed6a8", "#e8b89d", "#c4a5d4", "#f0c987", "#a8d8ea", "#b8c5d6", "#d4b8a0"];
      var hash = 0;
      for (var i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ text: text }));
      input.value = "";
    });

    // Start
    window.addEventListener("DOMContentLoaded", function() {
      var params = new URLSearchParams(window.location.search);
      inviteCode = params.get("invite");

      if (!inviteCode) {
        document.getElementById("player-placeholder").textContent = "Нет кода приглашения. Создайте комнату на главной странице.";
      }

      var sourcesModal = document.getElementById("sources-modal");
      var roomOwnerId = "";

      window.openSourceModal = function() {
        if (!roomOwnerId || roomOwnerId !== currentUserId) return;
        sourcesModal.style.display = "flex";
        loadSourcesForModal();
      };

      window.closeSourceModal = function() {
        sourcesModal.style.display = "none";
      };

      checkAuth().then(function(ok) {
        if (ok) {
          loadPlayerInternal();
          connect();
        }
      });
    });

    function loadPlayerInternal() {
      if (!inviteCode) return;

      var placeholder = document.getElementById("player-placeholder");
      var frame = document.getElementById("player-frame");
      var roomTitle = document.getElementById("room-title");
      var inviteDisplay = document.getElementById("invite-code-display");
      var contentLink = document.getElementById("content-link");

      if (!placeholder || !frame) return;

      fetch("/api/rooms/" + inviteCode).then(function(res) {
        if (!res.ok) {
          placeholder.textContent = "Комната не найдена";
          return res.json();
        }
        return res.json();
      }).then(function(room) {
        if (!room || room.error) {
          placeholder.textContent = "Ошибка загрузки";
          return;
        }
        console.log("Room data:", room);
        console.log("Source URL:", room.current_source?.url);

        if (roomTitle) roomTitle.textContent = room.name || "Комната";
        if (inviteDisplay) inviteDisplay.textContent = inviteCode;
        if (contentLink) contentLink.href = "/content.html?invite=" + inviteCode;
        roomOwnerId = room.owner_id;

        if (room.current_source && room.current_source.url) {
          frame.src = decodeURIComponent(room.current_source.url);
          frame.style.display = "block";
          placeholder.style.display = "none";
        } else {
          placeholder.innerHTML = 'Источник не выбран. <a href="/content.html?invite=' + inviteCode + '">Выберите на странице контента</a>.';
        }
      }).catch(function(e) {
        console.error("Player error:", e);
        placeholder.textContent = "Ошибка загрузки";
      });
    }

    async function loadSourcesForModal() {
      var list = document.getElementById("sources-list");
      var activeId = document.querySelector(".source-card-active")?.dataset?.id;

      try {
        var res = await fetch("/api/sources");
        var sources = await res.json();
        if (!res.ok || sources.length === 0) {
          list.innerHTML = "<p>Нет источников</p>";
          return;
        }
        list.innerHTML = sources.map(function(s) {
          var isActive = s.id === activeId;
          var cls = isActive ? "source-item source-item-active" : "source-item";
          return '<div class="' + cls + '" data-id="' + s.id + '" onclick="selectSource(\'' + s.id + '\')">' + esc(s.name) + (isActive ? " (активен)" : "") + '</div>';
        }).join("");
      } catch {
        list.innerHTML = "<p>Ошибка загрузки</p>";
      }
    }

    async function selectSource(id) {
      try {
        var res = await fetch("/api/rooms/" + inviteCode + "/source", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source_id: id }),
        });
        if (res.ok) {
          closeSourceModal();
          loadPlayer();
        } else {
          alert("Не удалось сменить источник");
        }
      } catch {
        alert("Ошибка");
      }
    }
  </script>

  <div id="sources-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Выберите источник</h2>
      <div id="sources-list" class="sources-list"></div>
      <button onclick="closeSourceModal()" class="cancel-btn" style="width:100%;margin-top:12px">Отмена</button>
    </div>
  </div>
</body>
</html>
