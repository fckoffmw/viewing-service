<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>w2g — Комната</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="room-body">

  <div class="room-video">
    <div class="room-top-left">
      <a href="/" title="На главную">←</a>
    </div>
    <div class="room-video-inner">
      <div id="room-placeholder" class="room-placeholder">Загрузка...</div>
      <iframe id="room-player" style="display:none" allowfullscreen></iframe>
    </div>
  </div>

  <div class="room-chat">
    <div class="room-chat-header">
      <span id="room-status-dot" class="room-status-dot offline"></span>
      <span id="room-online-text">отключено</span>
      <span id="room-member-count" class="room-msg-count"></span>
      <span id="room-source-name" class="room-source-name"></span>
      <div class="room-chat-header-right">
        <button class="room-chat-header-btn" id="room-menu-btn" title="Меню">⋮</button>
        <div class="room-header-menu" id="room-header-menu">
          <button class="room-header-menu-item" id="menu-change-source" onclick="openSourceModal()">Сменить источник</button>
          <button class="room-header-menu-item" onclick="copyLink()">Копировать ссылку</button>
          <button class="room-header-menu-item danger" id="menu-delete-room" onclick="deleteRoom()">Удалить комнату</button>
        </div>
      </div>
    </div>
    <div id="room-messages" class="room-messages"></div>
    <form id="room-chat-form" class="room-chat-form">
      <input id="room-chat-input" class="room-chat-input" type="text" placeholder="Сообщение..." maxlength="500" autocomplete="off">
      <button id="room-chat-send" class="room-chat-send" type="submit">→</button>
    </form>
  </div>

  <div class="modal-overlay" id="source-modal" style="display:none" onclick="if(event.target===this)closeSourceModal()">
    <div class="modal">
      <h2>Источники</h2>
      <div class="modal-source-list" id="source-list"></div>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeSourceModal()">Отмена</button>
      </div>
    </div>
  </div>
  
  <script src="/static/room.js"></script>
</body>
</html>
