<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Комнаты</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <a href="/" class="nav-logo">w2g</a>
      <a href="/index.html" class="nav-link active">Комнаты</a>
      <a href="/content.html" class="nav-link">Контент</a>
    </div>
    <div class="nav-right">
      <span class="nav-username" id="nav-username"></span>
      <button onclick="logout()" class="btn btn-secondary btn-sm">Выйти</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Комнаты</h1>
      <button onclick="openCreateModal()" class="btn btn-primary">+ Создать</button>
    </div>

    <div class="join-row">
      <input type="text" id="join-code" placeholder="Код комнаты" maxlength="8" onkeydown="if(event.key==='Enter')joinByCode()">
      <button onclick="joinByCode()" class="btn btn-secondary">Войти</button>
    </div>

    <div id="rooms-container"></div>
  </div>

  <!-- create modal -->
  <div id="create-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeCreateModal()">
    <div class="modal">
      <h2>Создать комнату</h2>
      <form id="create-form" onsubmit="return handleCreate(event)">
        <input type="text" id="room-name" placeholder="Название комнаты" required class="modal-input">
        <div class="modal-btns">
          <button type="button" onclick="closeCreateModal()" class="btn btn-secondary">Отмена</button>
          <button type="submit" class="btn btn-primary">Создать</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var currentUserId = ''
    var currentUsername = ''
    var container = document.getElementById('rooms-container');
    var rooms = []

    container.addEventListener('click', function(event) {
      if (event.target.classList.contains('btn-delete-room')) {
        var code = event.target.getAttribute('data-code');

        if (code) {
          deleteRoom(code);
        }
      }
    });

    checkAuth()

    async function checkAuth() {
      try {
        var res = await fetch('/auth/me')
        if (!res.ok) { window.location.href = '/login.html'; return }
        var user = await res.json()
        currentUserId = user.id
        currentUsername = user.username
        document.getElementById('nav-username').textContent = user.username
        loadRooms()
      } catch {
        window.location.href = '/login.html'
      }
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' })
      window.location.href = '/login.html'
    }

    // --- rooms ---
    async function loadRooms() {
      var container = document.getElementById('rooms-container')
      container.innerHTML = '<div class="empty">Загрузка...</div>'

      try {
        var res = await fetch('/api/rooms')
        if (!res.ok) { container.innerHTML = '<div class="empty">Ошибка загрузки</div>'; return }
        rooms = await res.json()
        renderRooms(rooms)
      } catch {
        container.innerHTML = '<div class="empty">Ошибка соединения</div>'
      }
    }

    function renderRooms(rooms) {
      var container = document.getElementById('rooms-container')

      if (rooms.length === 0) {
        container.innerHTML = '<div class="empty">Нет комнат. Создайте первую.</div>'
        return
      }

      container.innerHTML = rooms.map(function (r) {
        var source = r.current_source ? r.current_source.name : '\u2014'
        var members = r.members_online || 0
        var isOwner = r.owner_id === currentUserId
        return (
          '<div class="room-item">' +
            '<div class="room-info">' +
              '<h3>' + esc(r.name) + '</h3>' +
              '<div class="room-meta">' + esc(source) + ' \u00b7 ' + members + ' онлайн \u00b7 <span class="room-code" onclick="copyInvite(\'' + r.invite_code + '\')" title="Копировать ссылку">' + r.invite_code + '</span></div>' +
            '</div>' +
            '<div class="room-actions">' +
              '<a href="/room.html?invite=' + r.invite_code + '" class="btn btn-primary btn-sm">Войти</a>' +
              (isOwner ? '<button data-code="' + esc(r.invite_code) + '" class="btn btn-danger btn-sm btn-delete-room">\u2715</button>' : '') +
            '</div>' +
          '</div>'
        )
      }).join('')
    }

    function esc(s) {
      var d = document.createElement('div')
      d.textContent = s
      return d.innerHTML
        .replace(/\\/g, '\\\\')
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;');
    }

    function copyInvite(code) {
      var url = window.location.origin + '/room.html?invite=' + code
      navigator.clipboard.writeText(url).then(function () {
        showToast('Ссылка скопирована')
      })
    }

    // --- create room ---
    function openCreateModal() {
      document.getElementById('create-modal').style.display = 'flex'
      document.getElementById('room-name').value = ''
      document.getElementById('room-name').focus()
    }

    function closeCreateModal() {
      document.getElementById('create-modal').style.display = 'none'
    }

    async function handleCreate(e) {
      e.preventDefault()
      var name = document.getElementById('room-name').value.trim()
      if (!name) return

      var btn = e.target.querySelector('button[type="submit"]')
      btn.disabled = true
      btn.textContent = 'Создание...'

      try {
        var res = await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name }),
        })
        var data = await res.json()
        if (res.ok) {
          closeCreateModal()
          window.location.href = '/room.html?invite=' + data.invite_code
        } else {
          alert(data.error || 'Ошибка создания')
        }
      } catch {
        alert('Ошибка соединения')
      } finally {
        btn.disabled = false
        btn.textContent = 'Создать'
      }
    }

    // --- join ---
    function joinByCode() {
      var code = document.getElementById('join-code').value.trim().toUpperCase()
      if (!code) return
      window.location.href = '/room.html?invite=' + code
    }

    // --- delete room ---
    async function deleteRoom(code) {
      var delRoom = rooms.find(function (r) {
        return r.invite_code === code
      })

      if (!confirm('Удалить комнату "' + delRoom.name + '"? Это действие нельзя отменить.')) return
      
      try {
        var res = await fetch('/api/rooms/' + delRoom.invite_code, { method: 'DELETE' })
        if (res.ok) {
          loadRooms()
          showToast('Комната удалена')
        } else {
          var data = await res.json()
          alert(data.error || 'Ошибка удаления')
        }
      } catch {
        alert('Ошибка соединения')
      }
    }

    // --- toast ---
    function showToast(msg) {
      var el = document.createElement('div')
      el.textContent = msg
      el.className = 'toast'
      document.body.appendChild(el)
      setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { el.remove() }, 300) }, 2000)
    }
  </script>
</body>
</html>
