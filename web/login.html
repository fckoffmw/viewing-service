<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Вход</title>
</head>
<body>
  <nav class="auth-nav">
    <a href="/">w2g</a>
  </nav>

  <div class="auth-form">
    <h1>Вход</h1>
    <form id="login-form">
      <input type="text" id="username" placeholder="Имя пользователя" required minlength="3" autocomplete="username" class="auth-input">
      <input type="password" id="password" placeholder="Пароль" required minlength="4" autocomplete="current-password" class="auth-input">
      <button type="submit" class="auth-btn">Войти</button>
    </form>
    <div id="error" class="auth-error"></div>
    <p class="auth-switch">Нет аккаунта? <a href="/register.html">Регистрация</a></p>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
