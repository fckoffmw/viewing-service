<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w2g — Вход</title>
  <link rel="stylesheet" href="/static/index.css">
</head>
<body>
  <div class="container">
    <h1>Вход</h1>
    <form id="login-form" class="form">
      <input type="text" id="username" placeholder="Имя пользователя" required minlength="3">
      <input type="password" id="password" placeholder="Пароль" required minlength="4">
      <button type="submit" class="btn">Войти</button>
    </form>
    <p class="switch">Нет аккаунта? <a href="/register.html">Регистрация</a></p>
    <p id="error" class="error" style="display:none"></p>
  </div>

  <script>
    // Check if already logged in - redirect to index
    (async function() {
      var res = await fetch("/auth/me");
      if (res.ok) {
        window.location.href = "/index.html";
      }
    })();

    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      var errorEl = document.getElementById("error");

      var res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password }),
      });

      var data = await res.json();
      if (res.ok) {
        window.location.href = "/index.html";
      } else {
        errorEl.textContent = data.error || "Ошибка входа";
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
